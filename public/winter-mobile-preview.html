<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Saraaya winter — mobile layout review</title><style>body{margin:0;background:#ecebdc;color:#283619;font:15px system-ui,sans-serif}header{text-align:center;padding:16px}h1{font-size:20px;margin:0 0 6px}p{margin:0 0 12px}nav{display:flex;justify-content:center;gap:8px}button{padding:8px 16px;border:1px solid #283619;border-radius:24px;background:#fff9e1;color:#283619;cursor:pointer}button[aria-pressed=true]{background:#283619;color:white}main{display:flex;justify-content:center;padding:0 12px 20px}iframe{background:#fff9e1;width:390px;max-width:100%;height:760px;border:8px solid #283619;border-radius:22px;box-shadow:0 8px 30px #28361922}</style></head><body><header><h1>Saraaya · Mobile layout review</h1><p>Actual landing page rendered in a narrow viewport. Review only.</p><nav aria-label="Preview widths"><button type="button" data-width="360" aria-pressed="false">360 px</button><button type="button" data-width="390" aria-pressed="true">390 px</button><button type="button" data-width="430" aria-pressed="false">430 px</button></nav></header><main><iframe src="/winter-landing-page/" title="Saraaya winter landing page at mobile width"></iframe></main><script>for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{document.querySelector('iframe').style.width=button.dataset.width+'px';for(const item of document.querySelectorAll('button'))item.setAttribute('aria-pressed',String(item===button));});</script></body></html>
